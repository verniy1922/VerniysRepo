<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>康威生命游戏 · verniy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234A90D9'/%3E%3C/svg%3E">
<style>
  /* ===================== 设计变量（与其它页面一致） ===================== */
  :root{
    --blue:        #4A90D9;
    --blue-dark:   #3A7ABF;
    --blue-soft:   #EAF2FB;
    --blue-line:   #D6E6F7;
    --bg:          #F7F9FC;
    --card:        #FFFFFF;
    --text:        #3A3F47;
    --text-soft:   #6B7280;
    --text-faint:  #9AA3AF;
    --line:        #E8ECF1;
    --radius:      14px;
    --shadow:      0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.05);
    --shadow-lg:   0 2px 4px rgba(16,24,40,.05), 0 14px 32px rgba(16,24,40,.09);
    --maxw:        1120px;
  }

  /* ===================== 基础 ===================== */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--blue); text-decoration:none; }
  a:hover{ color:var(--blue-dark); text-decoration:underline; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:6px; }

  .shell{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:var(--maxw);
    margin:0 auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .audio-group{ display:flex; align-items:center; gap:8px; min-width:0; }

  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:7px 14px;
    font-size:14px;
    font-family:inherit;
    font-weight:600;
    line-height:1.4;
    color:var(--blue);
    background:#fff;
    border:1px solid var(--blue-line);
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background-color .18s ease, color .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover{
    background:var(--blue-soft);
    border-color:#C3DBF3;
    color:var(--blue-dark);
    text-decoration:none;
    transform:translateY(-1px);
  }
  .btn:active{ transform:translateY(0); }
  .btn-compact{ padding:7px 10px; }
  .btn-compact .label{ display:none; }

  /* ---------- 主体 ---------- */
  .main{ flex:1; width:100%; max-width:var(--maxw); margin:0 auto; padding:34px 20px 64px; }

  .eyebrow{ margin:0 0 6px; font-size:12.5px; letter-spacing:.14em; color:var(--blue); font-weight:700; }
  h1{ margin:0 0 10px; font-size:clamp(26px,4.6vw,36px); line-height:1.3; letter-spacing:-.01em; }
  .sub{ margin:0 0 22px; color:var(--text-soft); font-size:15.5px; max-width:62ch; }

  /* ---------- 游戏画面 ---------- */
  .frame-wrap{
    position:relative;
    width:100%;
    max-width:min(100%, calc((100vh - 260px) * 1.6));
    margin:0 auto;
    aspect-ratio:16 / 10;
    border-radius:var(--radius);
    overflow:hidden;
    background:#111;
    border:1px solid rgba(16,24,40,.08);
    box-shadow:var(--shadow-lg);
  }
  .game-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#111;
  }
  .frame-wrap:fullscreen{ border-radius:0; border:0; width:100vw; height:100vh; max-width:none; aspect-ratio:auto; }

  .tip{
    margin:0 0 14px;
    padding:11px 14px;
    font-size:13.5px;
    color:var(--blue-dark);
    background:var(--blue-soft);
    border:1px dashed var(--blue-line);
    border-radius:10px;
  }
  .tip b{ color:var(--blue-dark); }

  /* ---------- 说明卡片 ---------- */
  .card{
    margin-top:26px;
    padding:22px 24px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card h2{ margin:0 0 12px; font-size:17px; }
  .card ul{ margin:0; padding-left:1.2em; }
  .card li{ margin:6px 0; color:var(--text-soft); font-size:15px; }
  .card b{ color:var(--text); }

  /* ---------- 页脚 ---------- */
  .footer{ border-top:1px solid var(--line); background:#fff; }
  .footer-inner{
    max-width:var(--maxw);
    margin:0 auto;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--text-faint);
  }
  .footer-nav{ display:flex; gap:14px; flex-wrap:wrap; }

  @media (max-width:760px){
    .main{ padding:24px 16px 48px; }
    .topbar-inner{ padding:8px 12px; }
    .btn{ padding:7px 11px; font-size:13px; }
    .card{ padding:18px 16px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="btn btn-compact" href="../index.html">← 回到主页</a>
      <div class="audio-group">
        <button id="fsBtn" class="btn btn-compact" type="button" title="全屏游玩">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M2 5.6V3a1 1 0 0 1 1-1h2.6M14 5.6V3a1 1 0 0 0-1-1h-2.6M2 10.4V13a1 1 0 0 0 1 1h2.6M14 10.4V13a1 1 0 0 1-1 1h-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <p class="eyebrow">作品 · GAME</p>
    <h1>康威生命游戏</h1>
    <p class="sub">用 Godot 4 做的可调参数版本：自己点格子布下初始细胞，改掉存活 / 诞生规则，然后看它一代代演化下去。</p>

    <p id="mobileTip" class="tip" hidden>这个界面是按电脑屏幕设计的。<b>手机上会比较挤，建议点右上角的「全屏」，再把手机横过来</b>。</p>

    <div class="frame-wrap" id="frameWrap">
      <iframe id="gameFrame" class="game-frame" src="life/index.html" title="康威生命游戏" allow="autoplay; fullscreen; gamepad" scrolling="no"></iframe>
    </div>

    <section class="card">
      <h2>怎么玩</h2>
      <ul>
        <li><b>开始</b>：在格点上点一下放一个细胞，再点一次拿走。</li>
        <li><b>开始演化</b>：每 0.5 秒推进一代，「暂停演化 / 继续演化」随时停下。</li>
        <li>右下角的 <b>S / B</b> 用来改存活与诞生规则，默认就是经典的 B3/S23。</li>
        <li><b>选项</b> 里可以回到菜单，或者重新开一局。</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p style="margin:0">© <span id="year">2026</span> verniy</p>
      <nav class="footer-nav" aria-label="页脚导航">
        <a href="../index.html">主页</a>
        <a href="../about.html">关于我</a>
        <a href="../contact.html">联系我</a>
      </nav>
    </div>
  </footer>

</div>

<script>
/* ---------- 1. 进游戏页自动暂停背景音乐 ----------
   播放状态保存在 localStorage 里，其它页面靠它决定要不要自动续播。
   这里把它改成「暂停」，同时保留进度和当前第几首，回到主页时不会突然响起来。 */
(function () {
  var KEY = 'verniy.bgm.state.v1';
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var st = JSON.parse(raw) || {};
    if (st.playing) {
      st.playing = false;
      localStorage.setItem(KEY, JSON.stringify(st));
    }
  } catch (e) { /* 读不到就算了，不影响游戏 */ }
})();

/* ---------- 2. 全屏 ---------- */
(function () {
  var btn = document.getElementById('fsBtn');
  var wrap = document.getElementById('frameWrap');
  function isFull() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  btn.addEventListener('click', function () {
    var el = wrap;
    if (isFull()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });
  document.addEventListener('fullscreenchange', function () {
    var on = !!isFull();
    btn.classList.toggle('is-active', on);
    btn.title = on ? '退出全屏' : '全屏游玩';
  });
})();

/* ---------- 3. 小屏提示 ---------- */
(function () {
  var tip = document.getElementById('mobileTip');
  var small = window.matchMedia ? window.matchMedia('(max-width: 760px)').matches : window.innerWidth <= 760;
  if (small) tip.hidden = false;
})();

/* ---------- 4. 页脚年份 ---------- */
(function () {
  var y = document.getElementById('year');
  if (y) y.textContent = String(new Date().getFullYear());
})();
</script>
</body>
</html>
